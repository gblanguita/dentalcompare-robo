name: Robô de Preços

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rodar em modo teste (sem salvar no banco)'
        required: false
        type: boolean
        default: true

jobs:
  atualizar-precos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar navegador (Playwright)
        run: python -m playwright install --with-deps chromium

      - name: Rodar robô (modo teste)
        if: ${{ inputs.dry_run == true }}
        run: python robo_precos.py --dry-run --limite 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Rodar robô (modo real)
        if: ${{ inputs.dry_run != true }}
        run: python robo_precos.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
